<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCover Funeral - Demo</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">

  <meta name="theme-color" content="#007A3D">
</head>
<body>

<div class="container">

  <div class="topBar">
    <div class="brand">
      <div class="brandMark">N</div>
      <div class="brandText">
        <div class="brandTitle">Nedbank Demo</div>
        <div class="brandSub">Offline-first form capture + Azure SQL storage</div>
      </div>
    </div>
    <a class="dbLink" href="/view-database.html">View stored submissions</a>
  </div>

  <div class="status-box">
    <div id="connectionStatus">Checking...</div>
    <div id="syncStatus">Waiting...</div>
  </div>

  <div class="actionBar">
    <button id="saveDraftBtn" class="btnSecondary" type="button">Save draft</button>
    <button id="submitBtn" class="btnPrimary" type="button">Submit</button>
    <button id="syncBtn" class="btnGhost" type="button">Force sync</button>
    <button id="newAppBtn" class="btnGhost" type="button">New application</button>
  </div>

  <div id="formMount"></div>

</div>

<script src="db.js"></script>
<script src="product-schema.js"></script>
<script src="form-engine.js"></script>
<script src="render-form.js"></script>
<script src="app.js"></script>

</body>
</html>
